[project]
name = "alphaxiv-atlas"
version = "0.1.0"
description = "Auditable public-likes census and semantic atlas of alphaXiv papers"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx",
    "python-dotenv",
    "openai",
    "tiktoken",
    "numpy",
    "scipy",
    "scikit-learn>=1.5",
    "umap-learn",
    "matplotlib",
    "reportlab",
    "pyarrow",
    "filelock>=4.3.1",
]

[project.scripts]
atlas = "atlas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[dependency-groups]
dev = ["pytest", "pypdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
