<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Run progress · Paper Atlas</title>
<style>body{background:#f6f5ee;color:#153a35;font:16px/1.5 system-ui;margin:clamp(20px,7vw,100px) auto;padding:24px;max-width:680px}h1{font:48px Georgia,serif}h2{font-size:21px}progress{width:100%;height:18px;accent-color:#147465}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}small{color:#48635e}</style>
<h1>Paper Atlas</h1><h2 id="stage">Loading run progress…</h2><progress id="bar"></progress><p id="count"></p><pre id="extra"></pre><small id="stamp"></small>
<script>async function refresh(){try{const r=await fetch('progress.json',{cache:'no-store'});if(!r.ok)throw Error(r.status);const s=await r.json();stage.textContent=s.stage;if(s.total){bar.max=s.total;bar.value=s.done}else{bar.removeAttribute('value')}count.textContent=s.total?s.done+' of '+s.total+' completed':(s.done||0)+' completed';stamp.textContent=(s.updated_at||'')+' · '+(s.snapshot||'');extra.textContent=Object.entries(s).filter(([k])=>!['stage','total','done','updated_at','snapshot'].includes(k)).map(([k,v])=>k.replaceAll('_',' ')+'  '+v).join('\n')}catch(e){stage.textContent='Progress data unavailable'}}refresh();setInterval(refresh,3500)</script></html>
